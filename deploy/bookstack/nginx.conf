# ==============================================================================
# Seraph Protocol — Nginx Reverse Proxy Configuration for BookStack
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name docs.seraphprotocol.tech;

    # Redirect all plain HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.seraphprotocol.tech;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/docs.seraphprotocol.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/docs.seraphprotocol.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Performance & Upload limits for diagrams / assets
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:6875;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90;
    }
}

# ==============================================================================
# Optional: Main domain path routing (seraphprotocol.tech/docs -> docs.seraphprotocol.tech)
# ==============================================================================
